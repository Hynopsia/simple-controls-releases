name: An idea
description: Something Simple Controls could do, or do better.
labels: ["idea"]
body:
  - type: textarea
    id: idea
    attributes:
      label: The idea
      description: What you'd like, and what it would help you with.
    validations:
      required: true
  - type: textarea
    id: now
    attributes:
      label: How you do it now
      description: Optional. What you do today instead (in Simple Controls or the sim's own page).
